[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdflow"
version = "0.0.1"
authors = [{ name = "rebase.energy" }]
description = "Open-source framework for sequential decision problems: simulators, predictors, optimizers and the agents that connect them"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/rebase-energy/sdflow"
Repository = "https://github.com/rebase-energy/sdflow"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["sdflow"]

[tool.ruff]
line-length = 100
target-version = "py312"
